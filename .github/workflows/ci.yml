name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # Ordered cheapest first, and each step runs even after an earlier
      # failure: one push should report every problem, not just the first.
      - name: Lint
        run: bun run lint
      - name: Types and Astro diagnostics
        if: '!cancelled()'
        run: bun run check
      - name: Tests
        if: '!cancelled()'
        run: bun run test:run
      - name: Build
        if: '!cancelled()'
        run: bunx astro build

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Accessibility (axe)
        run: bun run test:a11y
